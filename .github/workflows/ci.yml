name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Unit tests
        run: python -m pytest tests -q
      - name: CPU smoke (both stages + resume)
        run: python scripts/smoke_rollout.py
      - name: Freeze task set and run the scripted self-check
        run: |
          python scripts/make_tasks.py --stage 1
          python scripts/run_baseline.py --tasks tasks/stage1.json --policy scripted --oracle answer
      - name: MCP path over a real stdio server
        run: python scripts/run_baseline.py --tasks tasks/stage2.json --policy scripted --env mcp
      - name: Export to verl format (validates every record)
        run: python scripts/export_verl.py --tasks tasks/stage1.json --out data/stage1.jsonl
      - name: Diagnostics and pre-flight
        run: |
          python scripts/difficulty_report.py --demo
          python scripts/build_verl_cmd.py --config configs/grpo_qwen3_8b.json --gpu 80
          python scripts/card_fit.py --gpu 24
          python scripts/scheduler_bench.py --episodes 64
